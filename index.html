<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شهادة حضور – اللقاء العلمي «كود الطرق السعودي»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f7f7;--card:#fff;--tx:#33383d;--mut:#6b7378;--pri:#3f8f99;--gold:#9a7b2f;--bd:#d9e2e3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191b;--card:#1d2427;--tx:#e8eced;--mut:#9aa5a9;--pri:#5fb3bd;--gold:#d2b165;--bd:#2f3a3e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14191b;--card:#1d2427;--tx:#e8eced;--mut:#9aa5a9;--pri:#5fb3bd;--gold:#d2b165;--bd:#2f3a3e;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px}
h1{font-size:1.35rem;margin:0 0 4px;color:var(--pri)}
.sub{margin:0 0 18px;color:var(--mut);font-size:.95rem}
.sub b{color:var(--gold)}
label{display:block;font-weight:700;margin-bottom:6px}
input{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
input:focus{outline:none;border-color:var(--pri)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--pri);color:#fff}
button.sec{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.go{width:100%;margin-top:14px;font-size:1.05rem}
.err{color:#c0392b;font-size:.9rem;margin-top:8px;min-height:1.2em}
#out{display:none;margin-top:20px}
#cv{width:100%;height:auto;border-radius:8px;border:1px solid var(--bd);display:block}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.row button{flex:1;min-width:140px}
.note{color:var(--mut);font-size:.85rem;margin-top:10px;min-height:1.2em}
</style>
</head>
<body>
<div class="wrap">
 <div class="card">
  <h1>شهادة حضور</h1>
  <p class="sub">اللقاء العلمي <b>«كود الطرق السعودي»</b> – مركز البحوث الهندسية والتقنية</p>
  <label for="nm">اكتب اسمك كما تريده أن يظهر في الشهادة</label>
  <input id="nm" type="text" maxlength="60" autocomplete="name" placeholder="الاسم الثلاثي">
  <label for="cd" style="margin-top:14px">رمز الحضور (يُعلن في القاعة)</label>
  <input id="cd" type="text" inputmode="numeric" maxlength="12" autocomplete="off" placeholder="أدخل الرمز">
  <div class="err" id="err"></div>
  <button class="go" id="mk">إنشاء الشهادة</button>
  <div id="out">
   <canvas id="cv" width="2338" height="1654"></canvas>
   <div class="row">
    <button id="dpng">تحميل صورة PNG</button>
    <button id="dpdf" class="sec">تحميل PDF</button>
   </div>
   <div class="note" id="note"></div>
  </div>
 </div>
</div>

const S=200, FF='"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,sans-serif';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
function load(src){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src;});}
let cache=null;
async function assets(){
  if(cache) return cache;
  const [bg,uni,vis,sign]=await Promise.all([IMG.bg,IMG.uni,IMG.vis,IMG.sign].map(load));
  try{await Promise.all([document.fonts.load('700 40px "IBM Plex Sans Arabic"','شهادة'),document.fonts.load('400 40px "IBM Plex Sans Arabic"','شهادة')]);}catch(e){}
  return cache={bg,uni,vis,sign};
}
function txt(t,x,y,w,h,pt,color,bold,fit){
  let px=pt*S/72;
  ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;
  const set=()=>ctx.font=(bold?'700 ':'400 ')+px+'px '+FF;
  set();
  const max=w*S-80;
  while(fit&&ctx.measureText(t).width>max&&px>30){px-=2;set();}
  ctx.fillText(t,(x+w/2)*S,(y+h/2)*S);
}
async function draw(name){
  const a=await assets();
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(a.bg,0,0,cv.width,cv.height);
  ctx.drawImage(a.uni,9.75*S,1.05*S,.95*S,1.09*S);
  ctx.drawImage(a.vis,1.0*S,1.15*S,1.45*S,1.03*S);
  ctx.drawImage(a.sign,2.33*S,7.08*S,.84*S,.495*S);
  const D='#33383D';
  txt('شهادة حضور',2.845,1.45,6.0,.95,46,'#3F8F99',1);
  txt('يشهد مركز البحوث الهندسية والتقنية بأن',1.545,2.4,8.6,.6,26,D,1);
  txt(name,2.2,3.08,7.3,.61,26,'#FFFFFF',1,1);
  txt('قد حضر اللقاء العلمي بعنوان',1.545,3.9,8.6,.4,18,D,0);
  txt('«كود الطرق السعودي»',1.545,4.3,8.6,.55,26,D,1);
  txt('معايير موحدة لطرق مستدامة وآمنة',1.545,4.82,8.6,.4,16,'#9A7B2F',1);
  txt('الذي أُقيم يوم الأحد 08 نوفمبر 2026م',1.545,5.45,8.6,.4,20,D,0);
  txt('وقدّمه الدكتور / علي بن حسين قابور، الأستاذ المساعد بقسم الهندسة المدنية والمعمارية',1.545,5.9,8.6,.4,17,D,0,1);
  txt('مدير مركز البحوث الهندسية والتقنية',1.0,6.4,3.5,.3,14,D,0);
  txt('د. أيمن بن محمد النعمي',1.0,6.7,3.5,.36,19,'#3F8F99',1);
}
let current='';
const END=Date.parse('2026-11-08T14:00:00+03:00');
function isClosed(){return Date.now()>=END;}
function showClosed(){document.querySelector('.card').innerHTML='<h1>انتهى وقت إصدار الشهادات</h1><p class="sub">أُغلق الإصدار عند الساعة 2:00 ظهراً من يوم الأحد 8 نوفمبر 2026م. للاستفسار تواصل مع مركز البحوث الهندسية والتقنية.</p>';}
const CODE_HASH='9f14025af0065b30e47e23ebb3b491d39ae8ed17d33739e5ff3827ffb3634953';
async function okCode(v){
  v=v.trim().replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776)).toLowerCase();
  try{const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')===CODE_HASH;}catch(e){return false;}
}
$('mk').onclick=async()=>{
  if(isClosed()){$('err').textContent='انتهى وقت إصدار الشهادات.';return;}
  const n=$('nm').value.replace(/\s+/g,' ').trim();
  if(n.length<3){$('err').textContent='فضلاً اكتب اسمك الكامل.';return;}
  if(!(await okCode($('cd').value))){$('err').textContent='رمز الحضور غير صحيح.';return;}
  $('err').textContent='';$('note').textContent='';
  current=n;
  try{await draw(n);$('out').style.display='block';$('out').scrollIntoView({behavior:'smooth'});}
  catch(e){$('err').textContent='تعذّر إنشاء الشهادة، حاول مرة أخرى.';}
};
$('cd').addEventListener('keydown',e=>{if(e.key==='Enter')$('mk').click();});
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')$('mk').click();});
function blob(type,q){return new Promise(r=>cv.toBlob(r,type,q));}
async function save(fn,data){
  let d=null;try{d=await claude.use('downloads');}catch(e){}
  if(!d){$('note').textContent='الحفظ المباشر غير متاح هنا. اضغط مطولاً على الشهادة واحفظ الصورة.';return;}
  try{await d.save({filename:fn,data});$('note').textContent='تم الحفظ ✓';}
  catch(e){if(e&&e.code!=='declined')$('note').textContent='تعذّر الحفظ، حاول مرة أخرى.';}
}
$('dpng').onclick=async()=>save('شهادة حضور - '+current+'.png',await blob('image/png'));
$('dpdf').onclick=async()=>{
  try{
    const {jsPDF}=window.jspdf;
    const p=new jsPDF({orientation:'landscape',unit:'in',format:[11.69,8.27]});
    p.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,11.69,8.27);
    await save('شهادة حضور - '+current+'.pdf',p.output('blob'));
  }catch(e){$('note').textContent='تعذّر إنشاء PDF، جرّب تحميل الصورة.';}
};
if(isClosed())showClosed();else assets();
</script>
